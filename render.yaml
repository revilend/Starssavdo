# =============================================================
# Render Blueprint — NFT YUT (FastAPI webhook, UZS + HUMO karta, 24/7)
# =============================================================
# Ishga tushirish:
#   1) Render Dashboard -> "New" -> "Blueprint"
#   2) Repozitoriy: https://github.com/revilend/Starssavdo
#   3) "sync: false" deb belgilangan o'zgaruvchilarni (BOT_TOKEN,
#      ADMIN_IDS, DATABASE_URL, WEBHOOK_URL, WEBHOOK_SECRET)
#      dashboard orqali qo'lda kiritasiz.
#
# Bot webhook rejimida ishlaydi:
#   - uvicorn `0.0.0.0:$PORT` da FastAPI ilovasini ko'taradi;
#   - `/` va `/health` -> 200 OK (Render health check + UptimeRobot);
#   - Telegram update'lari `/webhook` endpointiga keladi;
#   - PORT'ni Render o'zi beradi — qo'lda yozish shart emas.
# =============================================================
services:
  - type: web
    name: nftyutbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Webhook rejimi: FastAPI ilovasi (main.py ichidagi `app`)
    # Bitta worker — FSM MemoryStorage va TTL keshlar jarayon ichida.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # BotFather'dan olingan bot tokeni (dashboard'ga qo'lda kiritiladi)
      - key: BOT_TOKEN
        sync: false
      # Admin Telegram IDlari (vergul bilan ajratilgan)
      - key: ADMIN_IDS
        sync: false
      # Supabase connection string (Transaction Pooler: port 6543)
      - key: DATABASE_URL
        sync: false
      # Render bergan https manzil: https://<service>.onrender.com
      - key: WEBHOOK_URL
        sync: false
      # Telegram secret_token (A-Za-z0-9_- ; masalan: openssl rand -hex 32)
      - key: WEBHOOK_SECRET
        sync: false
      # To'lov kartasi (HUMO) — admin paneldan ham o'zgartiriladi
      - key: CARD_NUMBER
        value: 9860170111243573
      - key: CARD_HOLDER
        value: Murodjon Amirov
      # Karta to'lovida 1 Stars narxi (so'm) — unikal summa hisobi uchun
      - key: SOM_PER_STAR
        value: 300
      # Karta to'lovi so'rovi muddati (soniya); 300 = 5 daqiqa
      - key: DEPOSIT_TTL_SECONDS
        value: 300
      # Karta to'lovlari jurnali (yopiq guruh/kanal ID); 0 — o'chirilgan
      - key: CARD_LOG_CHAT_ID
        sync: false
      # Telethon userbot (@humocardbot xabarlari) — ixtiyoriy
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: HUMOCARD_BOT_USERNAME
        value: humocardbot
      # Ish rejimi: webhook (Render) yoki polling (lokal)
      - key: BOT_MODE
        value: webhook
      # Render Python versiyasi
      - key: PYTHON_VERSION
        value: 3.11.9
